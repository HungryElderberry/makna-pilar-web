<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Account Access - Makna x Pilar</title>

        <!-- Google Fonts: Playfair Display -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
            rel="stylesheet"
        />

        <!-- Bootstrap 5 CSS & Bootstrap Icons -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />

        <!-- Custom CSS -->
        <link rel="stylesheet" href="../style.css" />
    </head>

    <body>
        <!-- ==================== NAVBAR ==================== -->
        <app-navbar></app-navbar>

        <!-- ==================== MAIN AUTH CARD ==================== -->
        <main class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">
                    <div class="card info-section-card p-4 p-md-5">
                        <!-- Auth Toggle Tabs -->
                        <ul
                            class="nav nav-pills nav-fill mb-4 auth-tab-box"
                            id="authTabs"
                            role="tablist"
                        >
                            <li class="nav-item" role="presentation">
                                <button
                                    class="nav-link active auth-tab-btn"
                                    id="login-tab"
                                    data-bs-toggle="pill"
                                    data-bs-target="#login-panel"
                                    type="button"
                                    role="tab"
                                >
                                    Log In
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button
                                    class="nav-link auth-tab-btn"
                                    id="register-tab"
                                    data-bs-toggle="pill"
                                    data-bs-target="#register-panel"
                                    type="button"
                                    role="tab"
                                >
                                    Sign Up
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content" id="authTabsContent">
                            <!-- 1. LOGIN FORM -->
                            <div
                                class="tab-pane fade show active"
                                id="login-panel"
                                role="tabpanel"
                            >
                                <div class="text-center mb-4">
                                    <h3 class="h4 fw-bold">Welcome Back</h3>
                                    <p class="text-muted small">
                                        Masuk untuk melihat profil & pesanan
                                        Anda
                                    </p>
                                </div>

                                <form id="loginForm">
                                    <div class="mb-3">
                                        <label
                                            for="loginEmail"
                                            class="form-label small fw-semibold"
                                            >Email Address</label
                                        >
                                        <input
                                            type="email"
                                            class="form-control py-2"
                                            id="loginEmail"
                                            placeholder="nama@email.com"
                                            required
                                        />
                                    </div>

                                    <div class="mb-3">
                                        <label
                                            for="loginPassword"
                                            class="form-label small fw-semibold"
                                            >Password</label
                                        >
                                        <input
                                            type="password"
                                            class="form-control py-2"
                                            id="loginPassword"
                                            required
                                        />
                                    </div>

                                    <button
                                        type="submit"
                                        class="btn btn-orange w-100 py-2 mt-3"
                                    >
                                        Log In &rarr;
                                    </button>
                                </form>
                            </div>

                            <!-- 2. SIGN UP FORM -->
                            <div
                                class="tab-pane fade"
                                id="register-panel"
                                role="tabpanel"
                            >
                                <div class="text-center mb-4">
                                    <h3 class="h4 fw-bold">Create Account</h3>
                                    <p class="text-muted small">
                                        Daftar untuk menikmati berbagai layanan
                                    </p>
                                </div>

                                <form id="registerForm">
                                    <div class="mb-3">
                                        <label
                                            for="registerName"
                                            class="form-label small fw-semibold"
                                            >Full Name</label
                                        >
                                        <input
                                            type="text"
                                            class="form-control py-2"
                                            id="registerName"
                                            placeholder="Nama Lengkap"
                                            required
                                        />
                                    </div>

                                    <div class="mb-3">
                                        <label
                                            for="registerEmail"
                                            class="form-label small fw-semibold"
                                            >Email Address</label
                                        >
                                        <input
                                            type="email"
                                            class="form-control py-2"
                                            id="registerEmail"
                                            placeholder="nama@email.com"
                                            required
                                        />
                                    </div>

                                    <div class="mb-3">
                                        <label
                                            for="registerPhone"
                                            class="form-label small fw-semibold"
                                            >Phone Number</label
                                        >
                                        <input
                                            type="tel"
                                            class="form-control py-2"
                                            id="registerPhone"
                                            placeholder="081234567890"
                                            required
                                        />
                                    </div>

                                    <div class="mb-3">
                                        <label
                                            for="registerPassword"
                                            class="form-label small fw-semibold"
                                            >Password</label
                                        >
                                        <input
                                            type="password"
                                            class="form-control py-2"
                                            id="registerPassword"
                                            required
                                        />
                                        <div
                                            class="form-text text-muted"
                                            style="font-size: 0.75rem"
                                        >
                                            Minimal 8 karakter (kombinasi huruf
                                            besar, huruf kecil, dan angka).
                                        </div>
                                    </div>

                                    <button
                                        type="submit"
                                        class="btn btn-orange w-100 py-2 mt-3"
                                    >
                                        Sign Up Now &rarr;
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- ==================== FOOTER ==================== -->
        <app-footer></app-footer>

        <!-- Bootstrap 5 JS Bundle & Custom JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../components/header.js"></script>
        <script src="../components/footer.js"></script>
        <script src="../script.js"></script>
    </body>
</html>
