<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Your Cart - Makna x Pilar</title>

        <!-- Google Fonts: Playfair Display -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
            rel="stylesheet"
        />

        <!-- Bootstrap 5 CSS & Bootstrap Icons -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />

        <!-- Custom CSS -->
        <link rel="stylesheet" href="../style.css" />
    </head>

    <body>
        <!-- ==================== NAVBAR ==================== -->
        <app-navbar></app-navbar>

        <!-- ==================== MAIN CART VIEW ==================== -->
        <main class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-10">
                    <div class="text-center mb-4">
                        <span class="sub-title-tag">Review Your Order</span>
                        <h1 class="display-6 fw-bold mt-1">Shopping Cart</h1>
                    </div>

                    <div class="row g-4">
                        <!-- Daftar Item Keranjang -->
                        <div class="col-12 col-lg-8">
                            <div class="card info-section-card p-4">
                                <h5 class="fw-bold mb-3 border-bottom pb-2">
                                    Selected Items
                                </h5>

                                <!-- Wadah Item Dinamis -->
                                <div id="cartItemsList"></div>

                                <!-- Pesan Keranjang Kosong -->
                                <div
                                    id="emptyCartMessage"
                                    class="text-center py-5 d-none"
                                >
                                    <i
                                        class="bi bi-cart-x text-muted display-4"
                                    ></i>
                                    <h5 class="fw-bold mt-3 text-secondary">
                                        Keranjang Anda Masih Kosong
                                    </h5>
                                    <p class="text-muted small">
                                        Silakan pilih menu favorit Anda di
                                        halaman Menu.
                                    </p>
                                    <a
                                        href="menu.html"
                                        class="btn btn-orange btn-sm mt-2"
                                        >Buka Menu &rarr;</a
                                    >
                                </div>
                            </div>
                        </div>

                        <!-- Ringkasan Pembayaran -->
                        <div class="col-12 col-lg-4">
                            <div class="card info-section-card p-4">
                                <h5 class="fw-bold mb-3 border-bottom pb-2">
                                    Order Summary
                                </h5>

                                <div
                                    class="d-flex justify-content-between mb-2 small"
                                >
                                    <span class="text-secondary">Subtotal</span>
                                    <span class="fw-bold" id="cartSubtotal"
                                        >Rp 0</span
                                    >
                                </div>

                                <div
                                    class="d-flex justify-content-between mb-3 small"
                                >
                                    <span class="text-secondary"
                                        >Tax (PB1 10%)</span
                                    >
                                    <span class="fw-bold" id="cartTax"
                                        >Rp 0</span
                                    >
                                </div>

                                <hr class="opacity-25 my-2" />

                                <div
                                    class="d-flex justify-content-between mb-4"
                                >
                                    <span class="fw-bold">Grand Total</span>
                                    <span
                                        class="fw-bold text-danger h5 mb-0"
                                        id="cartGrandTotal"
                                        >Rp 0</span
                                    >
                                </div>

                                <button
                                    id="checkoutBtn"
                                    class="btn btn-orange w-100 py-2"
                                    onclick="
                                        alert(
                                            'Pesanan Anda berhasil dikirim ke kasir!',
                                        );
                                        localStorage.removeItem('userCart');
                                        window.location.reload();
                                    "
                                >
                                    Proceed to Checkout &rarr;
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- ==================== FOOTER ==================== -->
        <app-footer></app-footer>

        <!-- Bootstrap 5 JS Bundle & Scripts -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../components/header.js"></script>
        <script src="../components/footer.js"></script>
        <script src="../script.js"></script>
        <script src="../cart.js"></script>
    </body>
</html>
