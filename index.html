<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Welcome - Makna x Pilar</title>

        <!-- Google Fonts: Playfair Display -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
            rel="stylesheet"
        />

        <!-- Bootstrap 5 CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- Custom CSS -->
        <link rel="stylesheet" href="style.css" />

        <style>
            /* Landing Page Specific Styles */
            body,
            html {
                height: 100%;
                margin: 0;
                overflow: hidden; /* Prevent scrolling on welcome page */
                background-color: #1a1a1a;
            }

            .landing-bg {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-image: url("images/ambience/landscape.jpg");
                background-size: cover;
                background-position: center;
                z-index: -2;
                animation: slowZoom 20s ease-in-out infinite alternate;
            }

            .landing-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(
                    0,
                    0,
                    0,
                    0.65
                ); /* Dark overlay for readability */
                z-index: -1;
            }

            .landing-content {
                height: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                color: #ffffff;
                z-index: 1;
                padding: 0 20px;
            }

            .landing-logos {
                display: flex;
                gap: 20px;
                margin-bottom: 2rem;
                animation: fadeInDown 1.5s ease-out;
            }

            .landing-logos img {
                width: 90px;
                height: 90px;
                object-fit: cover;
                border-radius: 50%;
                border: 2px solid rgba(255, 255, 255, 0.8);
                background: #fff;
                padding: 5px;
            }

            .landing-title {
                font-family: "Playfair Display", serif;
                font-size: 3.5rem;
                font-weight: 700;
                margin-bottom: 1rem;
                animation: fadeInUp 1.5s ease-out 0.5s both;
            }

            .landing-subtitle {
                font-size: 1.1rem;
                font-weight: 300;
                opacity: 0.8;
                max-width: 600px;
                margin-bottom: 2.5rem;
                animation: fadeInUp 1.5s ease-out 0.8s both;
            }

            .btn-enter {
                background-color: #d15a29; /* Match btn-orange */
                color: #fff;
                padding: 12px 35px;
                font-size: 1.1rem;
                border-radius: 50px;
                text-transform: uppercase;
                letter-spacing: 2px;
                font-weight: 600;
                text-decoration: none;
                transition: all 0.3s ease;
                animation: fadeInUp 1.5s ease-out 1.1s both;
                border: 2px solid transparent;
            }

            .btn-enter:hover {
                background-color: transparent;
                border: 2px solid #d15a29;
                color: #d15a29;
            }

            /* Animations */
            @keyframes slowZoom {
                from {
                    transform: scale(1);
                }
                to {
                    transform: scale(1.05);
                }
            }

            @keyframes fadeInDown {
                from {
                    opacity: 0;
                    transform: translateY(-30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (max-width: 768px) {
                .landing-title {
                    font-size: 2.5rem;
                }
                .landing-logos img {
                    width: 70px;
                    height: 70px;
                }
            }
        </style>
    </head>
    <body>
        <!-- Background with animation and overlay -->
        <div class="landing-bg"></div>
        <div class="landing-overlay"></div>

        <!-- Main Content -->
        <div class="landing-content">
            <!-- Logos -->
            <div class="landing-logos">
                <img src="images/brand logo/Logo-Makna.jpg" alt="Makna Kopi" />
                <img
                    src="images/brand logo/Logo-Pilar_Kayu.jpg"
                    alt="Pilar Kayu Resto"
                />
            </div>

            <!-- Text -->
            <h1 class="landing-title">Good Coffee.<br />Great Food.</h1>
            <p class="landing-subtitle">
                Experience the perfect blend of specialty coffee from Makna Kopi
                and exquisite culinary creations from Pilar Kayu Resto. Two
                floors, endless memories.
            </p>

            <!-- CTA Button -->
            <a href="pages/home.html" class="btn-enter">Enter Site</a>
        </div>
    </body>
</html>
